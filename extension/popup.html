<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<main>
 <h1>Spatial Mirror Ink</h1>
 <label><input id="ink" type="checkbox"> Ink</label>
 <label><input id="keep" type="checkbox"> Keep ink</label>
 <label><input id="guide" type="checkbox"> Show gesture guide</label>
 <label><input id="lightboard" type="checkbox"> Text reads right for others</label>
 <div id="swatches" role="radiogroup" aria-label="Colour"></div>
 <div id="backgrounds" role="radiogroup" aria-label="Background"></div>
 <div id="slides"><button id="prev" type="button" aria-label="Previous slide">&lt;</button><span id="slide">Slide 1 of 6</span><button id="next" type="button" aria-label="Next slide">&gt;</button></div>
 <p class="note">Turn off your call app's own background effects, or they hide the ink.</p>
 <button id="clear" type="button">Clear</button>
 <p id="status" aria-live="polite">Waiting for camera</p>
</main>
<script src="popup.js"></script>
