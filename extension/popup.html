<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<main>
 <h1>Spatial Mirror Ink</h1>
 <label><input id="ink" type="checkbox"> Ink</label>
 <label><input id="keep" type="checkbox"> Keep ink</label>
 <label><input id="guide" type="checkbox"> Show gesture guide</label>
 <label><input id="lightboard" type="checkbox"> Text reads right for others</label>
 <div id="swatches" role="radiogroup" aria-label="Colour"></div>
 <div id="backgrounds" role="radiogroup" aria-label="Background"></div>
 <div id="layout-row" hidden><div id="layouts" role="radiogroup" aria-label="Where you sit"></div><button id="presenter" type="button" aria-pressed="true">You: In</button><label class="range">Video volume <input id="volume" type="range" min="0" max="100" step="5"></label><label><input id="duck" type="checkbox"> Lower video when I'm in</label><label><input id="hear" type="checkbox"> Hear video here</label><label><input id="palm" type="checkbox"> Open palm for 1 s pops in or out</label><p class="note">Pick a tab or video file from the bar at the top of the call tab. Alt+Shift+P pops you in or out. Use headphones if you hear the video here.</p></div>
 <div id="slides"><button id="prev" type="button" aria-label="Previous slide">&lt;</button><span id="slide">Slide 1 of 6</span><button id="next" type="button" aria-label="Next slide">&gt;</button></div>
 <p class="note">Turn off your call app's own background effects, or they hide the ink.</p>
 <button id="clear" type="button">Clear</button>
 <p id="status" aria-live="polite">Waiting for camera</p>
</main>
<script src="popup.js"></script>
